name: lightrag-local-multikb

services:
  lightrag:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${LIGHTRAG_ENV_FILE:-.env.local-multikb}
    environment:
      HOST: 0.0.0.0
      PORT: 9621
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      LIGHTRAG_KNOWLEDGE_BASE_CATALOG: /app/data/rag_storage/knowledge_bases.json
      LIGHTRAG_MULTI_WORKSPACE_MODE: multi
      LIGHTRAG_ADMIN_API_KEY: ${LIGHTRAG_ADMIN_API_KEY:?Set LIGHTRAG_ADMIN_API_KEY in the env file}
      LIGHTRAG_KNOWLEDGE_BASE_CATALOG_PROVIDER: local
      LIGHTRAG_WORKSPACE_COORDINATOR_PROVIDER: local
      LIGHTRAG_KV_STORAGE: RedisKVStorage
      LIGHTRAG_VECTOR_STORAGE: PGVectorStorage
      LIGHTRAG_GRAPH_STORAGE: Neo4JStorage
      LIGHTRAG_DOC_STATUS_STORAGE: PGDocStatusStorage
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      NEO4J_URI: neo4j://neo4j:7687
      REDIS_URI: redis://redis:6379/0
    ports:
      - "${LIGHTRAG_LOCAL_PORT:-9621}:9621"
    volumes:
      - ./data/local-multikb/rag_storage:/app/data/rag_storage
      - ./data/local-multikb/inputs:/app/data/inputs
      - ./data/local-multikb/prompts:/app/data/prompts
      - ./data/local-multikb/config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:9621/health', timeout=5).read()"
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag-local-password}
      POSTGRES_DB: ${POSTGRES_DATABASE:-rag}
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5432}:5432"
    volumes:
      - lightrag_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-lightrag-local-password}
      NEO4J_dbms_default__database: ${NEO4J_DATABASE:-neo4j}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_LOCAL_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_LOCAL_PORT:-7687}:7687"
    volumes:
      - lightrag_neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u "$${NEO4J_USERNAME:-neo4j}"
          -p "${NEO4J_PASSWORD:-lightrag-local-password}" "RETURN 1" >/dev/null
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:${REDIS_LOCAL_PORT:-6379}:6379"
    volumes:
      - lightrag_redis_data:/data
      - ./deploy/local-multikb/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  lightrag_postgres_data:
  lightrag_neo4j_data:
  lightrag_redis_data:
