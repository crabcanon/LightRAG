# Ephemeral same-host multi-worker topology for RFC-I16 integration tests.
# The LightRAG data plane uses the default file-backed stores while the
# knowledge-base catalog is durable PostgreSQL state shared by both workers.
#
# Start/build:
#   docker compose -f docker-compose.integration-gunicorn.yml up -d --build --wait
# Stop and remove test data:
#   docker compose -f docker-compose.integration-gunicorn.yml down -v
name: lightrag-multikb-gunicorn-it

services:
  lightrag:
    build:
      context: .
      dockerfile: Dockerfile
    image: lightrag-multitenant:gunicorn-it
    command: ["lightrag-gunicorn"]
    environment:
      HOST: 0.0.0.0
      PORT: 9621
      WORKERS: 2
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      PROMPT_DIR: /app/data/prompts
      LIGHTRAG_MULTI_WORKSPACE_MODE: multi
      LIGHTRAG_KNOWLEDGE_BASE_CATALOG_PROVIDER: postgres
      LIGHTRAG_WORKSPACE_COORDINATOR_PROVIDER: manager
      LIGHTRAG_CATALOG_POSTGRES_HOST: postgres
      LIGHTRAG_CATALOG_POSTGRES_PORT: 5432
      LIGHTRAG_CATALOG_POSTGRES_USER: rag
      LIGHTRAG_CATALOG_POSTGRES_PASSWORD: rag-gunicorn-it
      LIGHTRAG_CATALOG_POSTGRES_DATABASE: rag
      LIGHTRAG_ADMIN_API_KEY: gunicorn-integration-admin-key
      LIGHTRAG_ENABLE_NON_DEFAULT_WRITES: "true"
      LIGHTRAG_KV_STORAGE: JsonKVStorage
      LIGHTRAG_VECTOR_STORAGE: NanoVectorDBStorage
      LIGHTRAG_GRAPH_STORAGE: NetworkXStorage
      LIGHTRAG_DOC_STATUS_STORAGE: JsonDocStatusStorage
      LLM_BINDING: openai
      LLM_MODEL: integration-no-call
      LLM_BINDING_HOST: http://127.0.0.1:9/v1
      LLM_BINDING_API_KEY: integration-no-call
      EMBEDDING_BINDING: openai
      EMBEDDING_MODEL: integration-no-call
      EMBEDDING_DIM: 8
      EMBEDDING_BINDING_HOST: http://127.0.0.1:9/v1
      EMBEDDING_BINDING_API_KEY: integration-no-call
    ports:
      - "127.0.0.1:${IT_GUNICORN_PORT:-59621}:9621"
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:9621/health', timeout=5).read()"
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    init: true

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag-gunicorn-it
      POSTGRES_DB: rag
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

volumes:
  app_data:
  postgres_data:
