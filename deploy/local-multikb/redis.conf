# Local multi-knowledge-base Redis configuration.
bind 0.0.0.0
port 6379
protected-mode no
daemonize no
dir /data

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no

save 900 1
save 300 10
save 60 1000
stop-writes-on-bgsave-error yes
maxmemory-policy noeviction
